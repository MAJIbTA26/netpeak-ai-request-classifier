[project]
name = "netpeak-ai-request-classifier"
version = "0.1.0"
description = "AI-сервіс класифікації внутрішніх запитів компанії через Gemini API зі структурованим виводом (тестове завдання Netpeak)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ruslan Shevchuk" }]
dependencies = [
    "google-genai==0.3.0",
    "pydantic==2.10.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
classify-requests = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
